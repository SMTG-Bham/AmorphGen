# ============================================================================
# AmorphGen — Example YAML Configuration
# ============================================================================
# Usage:
#   amorphgen POSCAR --config config.yaml
#   amorphgen POSCAR --config config.yaml --device cpu   # CLI overrides YAML
#
# Precedence: CLI arguments > YAML config > built-in defaults
# Only include the settings you want to change — everything else uses defaults.
# ============================================================================

# ── Calculator ───────────────────────────────────────────────────────────────
model: mace-mpa-0           # Foundation model: mace-mpa-0, chgnet, 7net-mf-ompa, etc.
# model_path: /path/to/custom.model   # Local model file (overrides model)
device: cuda                 # cuda, cpu, mps, or auto
default_dtype: float64       # float64 for optimisation, float32 for faster MD

# ── Trajectory output format ────────────────────────────────────────────────
traj_format: extxyz          # extxyz, xyz, traj, lammps-dump

# ── Stage 1 & 7: Structure optimisation ─────────────────────────────────────
opt:
  fmax: 0.01                 # eV/A — force convergence threshold
  max_steps: 1000
  optimizer: LBFGS           # LBFGS, FIRE, BFGSLineSearch, BFGS, MDMin
  cell_filter: UnitCellFilter  # UnitCellFilter, ExpCellFilter, StrainFilter, cubic, none

# ── Stage 2: Pre-melt equilibration ─────────────────────────────────────────
eq_premelt:
  ensemble: NVT              # NVT or NPT
  T: 300                     # K
  steps: 50000               # 50 ps at 1 fs timestep
  timestep: 0.5              # fs
  friction: 0.01             # 1/fs (Langevin thermostat)

# ── Stage 3: Melt (heating ramp) ────────────────────────────────────────────
melt:
  ensemble: NPT              # NVT or NPT
  T_start: 300               # K
  T_end: 3000                # K
  T_step: 100                # K per ramp segment
  steps_per_T: 1000
  timestep: 0.5              # fs
  friction: 0.01             # 1/fs (NVT Langevin)
  ttime: 25.0                # fs (NPT thermostat coupling)

# ── Stage 4: High-temperature equilibration ─────────────────────────────────
eq_high:
  ensemble: NVT
  T: 3000                    # K (should match melt T_end)
  steps: 10000
  timestep: 0.5
  friction: 0.01

# ── Stage 5: Quench (cooling ramp) ──────────────────────────────────────────
quench:
  ensemble: NVT
  T_start: 3000              # K (should match eq_high T)
  T_end: 300                 # K
  T_step: -100               # K (negative = cooling)
  steps_per_T: 1000
  timestep: 0.5
  friction: 0.01
  ttime: 25.0

# ── Stage 6: Low-temperature equilibration ──────────────────────────────────
eq_low:
  ensemble: NVT
  T: 300                     # K (should match quench T_end)
  steps: 10000
  timestep: 0.5
  friction: 0.01

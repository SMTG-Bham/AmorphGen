[build-system]
# 77 is the first setuptools that reads an SPDX `license` string (PEP 639);
# it builds wheels itself, so the separate `wheel` package is not needed.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amorphgen"
version = "1.0.0rc4"
description = "Amorphous structure generation via melt-quench MD and random placement"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Names only, so the metadata lists the authors in this order in one field (an
# entry with an email goes to a separate Author-email field); the contact
# address is on the maintainer.
authors = [
    {name = "Chaiyawat Kaewmeechai"},
    {name = "Louie Slocombe"},
    {name = "David O. Scanlon"},
]
maintainers = [
    {name = "Chaiyawat Kaewmeechai", email = "c.kaewmeechai@bham.ac.uk"},
]
keywords = [
    "amorphous",
    "molecular-dynamics",
    "melt-quench",
    "MLIP",
    "MACE",
    "CHGNet",
    "SevenNet",
    "ASE",
    "materials-science",
    "DFT",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies — always needed
# Deliberately torch-free: random generation, analysis, and the classical
# (LJ / Buckingham, NumPy-vectorised) pipelines run without PyTorch. Torch
# arrives transitively with any MLIP extra ([mace], [chgnet], [sevennet]);
# device="auto" resolves to "cpu" when torch is absent (utils.common.
# resolve_device). Keeps the bare install ~50 MB instead of ~2 GB.
#
# The lower bounds are tested: the min-deps CI job installs exactly these
# versions on the oldest supported Python. Raise one when that job fails.
dependencies = [
    # ase.filters (imported at module level) arrived in 3.23;
    # ase.md.nose_hoover_chain.IsotropicMTKNPT (npt_method="mtk") in 3.25.
    "ase>=3.25",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    # Plotting is part of the base analysis story (--analyse --save-plot on a
    # bare install); matplotlib is ML-free and modest (~30 MB). Before 3.6.1,
    # violinplot (the density panel) raises IndexError under numpy>=1.24.
    "matplotlib>=3.6.1",
]

[project.optional-dependencies]
# Individual backend extras.
#
# MACE pre-trained foundation models (mace-mpa-0 etc.) were pickled with
# e3nn 0.4.x, which uses 2-tuples in `_codegen`. e3nn 0.5+ switched to
# 3-tuples and raises "ValueError: too many values to unpack" when the
# foundation model is loaded. Pin e3nn here to keep MACE working
# out-of-the-box.
mace = [
    "mace-torch>=0.3",
    "e3nn>=0.4.4,<0.5",
]
chgnet = [
    "chgnet>=0.3",
]
# SevenNet pulls in e3nn>=0.5, which conflicts with the MACE pin above.
# Install SevenNet in its own environment, or with `[full]` if you accept
# that MACE foundation-model loading may then break.
torchsim = [
    "torch-sim-atomistic>=0.6; python_version >= '3.12'",
]
sevennet = [
    "sevenn>=0.10",
]

# DEPRECATED alias (matplotlib moved into the core dependencies; see
# DESIGN_MLIP_OPTIONAL.md D6). Kept as a no-op for one release so existing
# `pip install amorphgen[analysis]` lines keep working; remove after v1.1.
analysis = []

# Convenience bundles
# `[all]` covers the conflict-free combo (MACE + CHGNet + analysis); for
# SevenNet alongside MACE see the docs note on separate envs.
all = [
    "mace-torch>=0.3",
    "e3nn>=0.4.4,<0.5",
    "chgnet>=0.3",
]
# Everything in one env -- only works if you skip MACE foundation models
# or use a mace-torch build that supports e3nn>=0.5. Read docs first.
full = [
    "mace-torch>=0.3",
    "chgnet>=0.3",
    "sevenn>=0.10",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "sphinx-design",
]

[project.urls]
Homepage = "https://github.com/SMTG-Bham/AmorphGen"
Documentation = "https://smtg-bham.github.io/AmorphGen/"
Repository = "https://github.com/SMTG-Bham/AmorphGen"
Issues = "https://github.com/SMTG-Bham/AmorphGen/issues"

[project.scripts]
amorphgen = "amorphgen.cli:main"

[tool.setuptools.packages.find]
include = ["amorphgen*"]

[tool.setuptools.package-data]
amorphgen = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["-v", "--tb=short"]
# Warnings raised inside dependencies, which AmorphGen cannot act on; its own
# code raises none of them. Matched by message only: pytest.warns re-emits the
# warnings it does not match under the module name "warnings", which a module
# pattern (":ase") would miss.
filterwarnings = [
    # ASE <= 3.29 sets ndarray.shape in place (Atoms.copy, MolecularDynamics,
    # the .traj reader), which NumPy 2.5 deprecates: thousands per run. Drop
    # once an ASE release reshapes instead.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # Loading a MACE foundation model (the GPU and --run-mace tests): MACE and
    # e3nn use TorchScript, which torch deprecates, and MACE sets
    # TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD on import, which torch then reports.
    "ignore:`torch.jit.load` is deprecated:FutureWarning",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:Environment variable TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD detected:UserWarning",
]

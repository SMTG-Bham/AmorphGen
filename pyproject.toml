[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amorphgen"
version = "2.0.0"
description = "Model-agnostic melt-and-quench pipeline for amorphous structure generation using universal machine learning force fields"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Chayawat Kaewmeechai"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies — always needed
dependencies = [
    "ase>=3.22",
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
# Individual backend extras
mace = [
    "mace-torch>=0.3",
]
chgnet = [
    "chgnet>=0.3",
]
m3gnet = [
    "matgl>=1.0",
]

# Convenience bundles
all = [
    "mace-torch>=0.3",
    "chgnet>=0.3",
    "matgl>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/cywkmc21/AmorphGen"
Repository = "https://github.com/cywkmc21/AmorphGen"
Issues = "https://github.com/cywkmc21/AmorphGen/issues"

[project.scripts]
amorphgen = "amorphgen.cli:main"

[tool.setuptools.packages.find]
include = ["amorphgen*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["-v", "--tb=short"]

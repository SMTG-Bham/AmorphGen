[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amorphMD"
version = "1.2.0"
description = "7-stage melt-and-quench pipeline for amorphous oxide generation with MACE-MP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "molecular-dynamics", "amorphous", "oxide", "MACE",
    "machine-learning", "force-field", "materials-science", "ASE"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "ase>=3.22",
    "numpy>=1.24",
    "mace-torch>=0.3.9",
]

[project.optional-dependencies]
symmetry = ["pymatgen>=2024.1"]
all      = ["pymatgen>=2024.1"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["amorphMD*"]
